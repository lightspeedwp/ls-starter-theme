name: Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Check for unreplaced template placeholders
        id: placeholder-check
        run: |
          if grep -q '{{' composer.json; then
            echo "unscaffolded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::composer.json still contains {{ }} template placeholders; skipping Composer validation until the theme is scaffolded."
          else
            echo "unscaffolded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Composer cache directory
        id: composer-cache
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v6
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP syntax
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        run: composer run lint:php

      - name: Run PHP Code Sniffer
        if: steps.placeholder-check.outputs.unscaffolded != 'true'
        run: composer run phpcs

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run security scan
        run: npm run security:scan

      - name: Check pattern escaping
        run: npm run patterns:escape
